name: Publish to GitHub Packages

# Push a tag such as v0.1.0 after setting the same version (0.1.0) in pom.xml.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          # Writes the server "github" to settings.xml with GITHUB_ACTOR and GITHUB_TOKEN
          server-id: github

      - name: Check that the tag matches the version in pom.xml
        run: |
          VERSION=$(mvn --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the version ${VERSION} in pom.xml"
            exit 1
          fi

      - name: Publish
        run: mvn --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
